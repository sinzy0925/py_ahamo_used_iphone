# GitHub Pages が 404 で失敗する場合:
# Repository → Settings → Pages → Source で「GitHub Actions」を選ぶこと（詳細は GITHUB_PAGES_SETUP.md）
name: ahamo screenshot → GitHub Pages

on:
  schedule:
    # 毎時 0 分・30 分（UTC）。※ GitHub は必ず UTC。JST は +9 時間（例: UTC 00:30 = JST 09:30）
    - cron: "*/30 * * * *"
  workflow_dispatch:

# checkout と Pages アーティファクトのアップロード用。詳細は GITHUB_PAGES_SETUP.md
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 価格変動日の永続化（ジョブ間）。リポジトリに JSON をコミットしない場合でも CI で引き継げる。
      - uses: actions/cache@v4
        with:
          path: inventory_price_state.json
          key: ${{ runner.os }}-ahamo-inventory-price-state-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Playwright の Chromium バイナリ（~/.cache/ms-playwright）。requirements の変更でキー更新。
      - uses: actions/cache@v4
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # システム依存は毎回（ランナーは毎回クリーン）。ブラウザ取得だけキャッシュで短縮。
      - name: Install Playwright Chromium
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: Run automation (リユース品一覧)
        run: python main.py --user-agent --headless

      - name: Run automation (新品 iPhone 一覧)
        run: python main.py --user-agent --headless --flow new-iphone

      - name: Build static site
        env:
          GAS_TRIGGER_URL: ${{ secrets.GAS_TRIGGER_URL }}
        run: python build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages が要求する権限（ジョブ単位での指定が推奨）
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
